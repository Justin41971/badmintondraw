
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Badminton Draw Builder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         HOME
    ====================================================== -->

    <main id="homePage" class="page">

        <div class="home-container">

            <h1>Badminton Draw Builder</h1>

            <div class="home-card">

                <h2>Create Tournament</h2>

                <label for="tournamentName">
                    Tournament Name
                </label>

                <input
                    id="tournamentName"
                    type="text"
                    placeholder="Tournament name"
                    autocomplete="off"
                >

                <label>
                    Draw Size
                </label>

                <div class="draw-size-options">

                    <button
                        type="button"
                        class="size-button active"
                        data-size="64"
                    >
                        <strong>R64</strong>
                        <span>64 players</span>
                    </button>

                    <button
                        type="button"
                        class="size-button"
                        data-size="32"
                    >
                        <strong>R32</strong>
                        <span>32 players</span>
                    </button>

                </div>

                <button
                    type="button"
                    id="createTournamentButton"
                    class="primary-button"
                >
                    Create Draw
                </button>

            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <button
                type="button"
                id="importButton"
                class="secondary-button"
            >
                Open Shared Draw
            </button>

            <input
                type="file"
                id="importFile"
                accept=".json"
                hidden
            >

        </div>

    </main>


    <!-- =====================================================
         DRAW
    ====================================================== -->

    <main id="drawPage" class="page hidden">

        <header class="topbar">

            <div class="topbar-left">

                <button
                    type="button"
                    id="backButton"
                    class="back-button"
                    title="Back"
                >
                    ←
                </button>

                <div class="tournament-info">

                    <div
                        id="drawTournamentName"
                        class="tournament-title"
                    >
                        Tournament
                    </div>

                    <div
                        id="drawSizeLabel"
                        class="tournament-subtitle"
                    >
                        R64
                    </div>

                </div>

            </div>

            <div class="topbar-actions">

                <button
                    type="button"
                    id="resetButton"
                    class="small-button"
                >
                    Reset
                </button>

                <button
                    type="button"
                    id="shareTemplateButton"
                    class="small-button"
                >
                    Share Template
                </button>

                <button
                    type="button"
                    id="sharePredictionButton"
                    class="primary-small-button"
                >
                    Share Prediction
                </button>

            </div>

        </header>


        <!-- =================================================
             PREDICTOR
        ================================================== -->

        <section class="predictor-bar">

            <div class="predictor-name">

                <label for="predictorName">
                    Your Name
                </label>

                <input
                    id="predictorName"
                    type="text"
                    placeholder="Enter your name"
                    autocomplete="off"
                >

            </div>

            <div class="save-status">

                <span class="status-dot"></span>

                <span id="saveStatus">
                    Saved locally
                </span>

            </div>

        </section>


        <!-- =================================================
             DRAW
        ================================================== -->

        <section class="draw-wrapper">

            <div
                id="drawContainer"
                class="draw-container"
            ></div>

        </section>


        <!-- =================================================
             CHAMPION
        ================================================== -->

        <section
            id="championSection"
            class="champion-section hidden"
        >

            <div class="champion-label">
                Champion
            </div>

            <div
                id="championDisplay"
                class="champion-display"
            ></div>

        </section>

    </main>


    <!-- =====================================================
         COUNTRY MODAL
    ====================================================== -->

    <div
        id="countryModal"
        class="modal hidden"
    >

        <div class="modal-background"></div>

        <div class="country-modal">

            <div class="modal-header">

                <h2>Select Country</h2>

                <button
                    type="button"
                    id="closeCountryModal"
                    class="close-button"
                >
                    ×
                </button>

            </div>

            <input
                id="countrySearch"
                type="text"
                class="country-search"
                placeholder="Search country..."
                autocomplete="off"
            >

            <div
                id="countryList"
                class="country-list"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         SHARE MODAL
    ====================================================== -->

    <div
        id="shareModal"
        class="modal hidden"
    >

        <div class="modal-background"></div>

        <div class="share-modal">

            <div class="modal-header">

                <h2 id="shareModalTitle">
                    Share Draw
                </h2>

                <button
                    type="button"
                    id="closeShareModal"
                    class="close-button"
                >
                    ×
                </button>

            </div>

            <p id="shareModalDescription">
                Copy this link and send it to someone.
            </p>

            <div class="share-link-container">

                <input
                    id="shareLink"
                    type="text"
                    readonly
                >

                <button
                    type="button"
                    id="copyShareLink"
                    class="copy-button"
                >
                    Copy
                </button>

            </div>

        </div>

    </div>


    <script src="countries.js"></script>
    <script src="app.js"></script>

</body>
</html>
